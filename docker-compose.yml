services:
  postgres:
    image: postgres:16-alpine
    container_name: one-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: one
      POSTGRES_PASSWORD: one_dev_password
      POSTGRES_DB: one
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
